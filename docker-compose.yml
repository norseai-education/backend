version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh
    entrypoint: ["/bin/bash", "/ollama-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - norseai
    # Uncomment if you have GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
  
  norseai-backend:
    build: .
    container_name: norseai-backend
    ports:
      - "6700:6700"
    env_file:
      - stack.env
    restart: unless-stopped
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
 
    networks:
      - traefik-public
      - norseai
      
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.norseai-backend.rule=Host(`norseai.sunshinek12.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.norseai-backend.entrypoints=websecure"
      - "traefik.http.routers.norseai-backend.tls=true"
      - "traefik.http.routers.norseai-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.norseai-backend.loadbalancer.server.port=6700"
      - "traefik.http.middlewares.norseai-backend-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.norseai-backend.middlewares=norseai-backend-stripprefix"
      
networks:
  traefik-public:
    external: true
  norseai:
    external: true

volumes:
  ollama-data:  
