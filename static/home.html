<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorseAI - AI Learning Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e2e8f0;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(600px circle at 20% 30%, #3b82f620 0%, transparent 50%),
                radial-gradient(800px circle at 80% 70%, #3b82f620 0%, transparent 50%),
                radial-gradient(400px circle at 40% 80%, #06b6d420 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 60px;
            background: transparent;
            backdrop-filter: none;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            height: 60px;
            width: 60px;
            transition: transform 0.3s ease;
            display: none;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .auth-buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: none;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.1);
            color: #e2e8f0;
            border-color: rgba(148, 163, 184, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
        }

        .btn-primary {
            background: transparent;
            color: white;
            border: none;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 40px;
            position: relative;
        }

        .hero {
            max-width: 800px;
            margin-bottom: 60px;
        }

        .hero-logo {
            width: 400px;
            height: auto;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .hero-logo:hover {
            transform: scale(1.02);
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 50px;
            color: #94a3b8;
            line-height: 1.7;
            font-weight: 400;
        }

        .tagline {
            font-size: 1.1rem;
            color: #64748b;
            margin-top: 40px;
            font-style: italic;
        }

        /* Floating elements animation */
        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .geometric-shape {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f640, #06b6d440);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        footer {
            padding: 30px 60px;
            text-align: center;
            color: #64748b;
            border-top: 1px solid rgba(59, 130, 246, 0.1);
            background: rgba(15, 15, 35, 0.5);
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            header {
                padding: 20px 30px;
                flex-direction: column;
                gap: 25px;
            }

            .logo {
                height: 50px;
                width: 50px;
            }

            .hero-logo {
                width: 320px;
            }

            .hero p {
                font-size: 1.2rem;
            }

            .main-content {
                padding: 60px 20px;
            }

            .auth-buttons {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Responsive design for very small screens */
        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .logo {
                height: 45px;
                width: 45px;
            }

            .hero-logo {
                width: 280px;
            }

            footer {
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating geometric elements -->
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>

    <div class="container">
        <header>
            <div class="auth-buttons">
                <a href="/login" class="btn btn-secondary">Login</a>
                <a href="/signup" class="btn btn-primary">Get Started</a>
            </div>
        </header>

        <main class="main-content">
            <div class="hero">
                <svg class="hero-logo" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradient for the main text -->
                        <linearGradient id="heroTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#7ea6e8;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#94a3b8;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Gradient for the Norse symbol -->
                        <linearGradient id="heroSymbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ecedee;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#c6d3e8;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Glow effect -->
                        <filter id="heroGlow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge> 
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        
                        <!-- Subtle shadow -->
                        <filter id="heroShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(59, 130, 246, 0.3)"/>
                        </filter>
                    </defs>
                    
                    <!-- Norse-inspired geometric symbol (combination of Valknut and circuit patterns) -->
                    <g transform="translate(45, 50)" filter="url(#heroGlow)">
                        <!-- Central triangle (Valknut inspired) - made even bigger -->
                        <polygon points="-24,-16 24,-16 0,24" fill="none" stroke="url(#heroSymbolGradient)" stroke-width="2.5" stroke-linejoin="round"/>
                        
                        <!-- AI circuit nodes -->
                        <circle cx="-16" cy="-11" r="2.5" fill="url(#heroSymbolGradient)"/>
                        <circle cx="16" cy="-11" r="2.5" fill="url(#heroSymbolGradient)"/>
                        <circle cx="0" cy="16" r="2.5" fill="url(#heroSymbolGradient)"/>
                        <circle cx="0" cy="-4" r="2" fill="url(#heroSymbolGradient)"/>
                        
                        <!-- Connection lines (AI network) -->
                        <line x1="-16" y1="-11" x2="0" y2="-4" stroke="url(#heroSymbolGradient)" stroke-width="1.2" opacity="0.7"/>
                        <line x1="16" y1="-11" x2="0" y2="-4" stroke="url(#heroSymbolGradient)" stroke-width="1.2" opacity="0.7"/>
                        <line x1="0" y1="-4" x2="0.0001" y2="16" stroke="url(#heroSymbolGradient)" stroke-width="1.2" opacity="0.7"/>
                    </g>
                    
                    <!-- Main text: NorseAI -->
                    <text x="95" y="50" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#heroTextGradient)" filter="url(#heroShadow)">
                        NorseAI
                    </text>
                    
                    <!-- Subtitle: TEACHER -->
                    <text x="95" y="75" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2px">
                        TEACHER
                    </text>
                    
                    <!-- Decorative underline -->
                    <line x1="95" y1="82" x2="200" y2="82" stroke="url(#heroTextGradient)" stroke-width="2" opacity="0.6"/>
                    
                    <!-- Subtle tech accent dots -->
                    <circle cx="210" cy="45" r="2" fill="#3b82f6" opacity="0.6">
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="220" cy="40" r="1.5" fill="#3b82f6" opacity="0.4">
                        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="215" cy="55" r="1" fill="#3b82f6" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
                    </circle>
                </svg>
                <p>The future of learning is here. Experience education powered by advanced artificial intelligence.</p>
                <div class="tagline">Join thousands of learners already transforming their educational journey</div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 NorseAI. Revolutionizing education through AI.</p>
        </footer>
    </div>
</body>
</html>
