version: '3.8'

services:
  norseai-backend:
    build: .
    container_name: norseai-backend
    ports:
      - "6700:6700"
    #environment:
    #  - PYTHONPATH=/norseai-backend
    env_file:
      - stack.env
    # volumes:
    #   - ./src:/app/src
    restart: unless-stopped
    networks:
      - traefik-public
labels:
  - "traefik.enable=true"
  - "traefik.http.routers.norseai-api.rule=Host(`norseai.sunshinek12.com`) && PathPrefix(`/api`)"
  - "traefik.http.routers.norseai-api.entrypoints=websecure"
  - "traefik.http.routers.norseai-api.tls=true"
  - "traefik.http.routers.norseai-api.tls.certresolver=letsencrypt"
  - "traefik.http.services.norseai-api.loadbalancer.server.port=6700"
      
networks:
  traefik-public:
    external: true

    
