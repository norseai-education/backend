<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NorseAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Smooth scrolling behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 15, 35, 0.5);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 6px;
            border: 2px solid rgba(15, 15, 35, 0.5);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        /* Firefox scrollbar */
        html {
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 rgba(15, 15, 35, 0.5);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
            position: relative;
            overflow-x: hidden; /* Prevent horizontal scroll */
            padding: 20px 0; /* Add some vertical padding */
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed; /* Changed to fixed for better scrolling */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(600px circle at 20% 30%, #3b82f620 0%, transparent 50%),
                radial-gradient(800px circle at 80% 70%, #8b5cf620 0%, transparent 50%),
                radial-gradient(400px circle at 40% 80%, #06b6d420 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .floating-element {
            position: fixed; /* Changed to fixed for better performance */
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 70%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            bottom: 15%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .geometric-shape {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f640, #8b5cf640);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        /* Scroll-triggered animation classes */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in-up.animate {
            opacity: 1;
            transform: translateY(0);
        }

        .signup-container {
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(59, 130, 246, 0.2);
            position: relative;
            z-index: 10;
            margin: auto;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 15, 35, 0.6);
            color: #e2e8f0;
            backdrop-filter: blur(10px);
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 15, 35, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667489, #d8dced);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #374151, #4b5563);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn:disabled::before {
            display: none;
        }

        .links {
            margin-top: 35px;
            padding-top: 35px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }

        .links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(10px);
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            backdrop-filter: blur(10px);
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-link {
            position: fixed; /* Changed to fixed for better behavior */
            top: 30px;
            left: 30px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            background: rgba(15, 15, 35, 0.6);
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            z-index: 20;
        }

        .back-link:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
        }

        /* Scroll to top button */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .scroll-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }

        .password-strength {
            font-size: 13px;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .strength-weak {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .strength-medium {
            background: rgba(245, 158, 11, 0.1);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .strength-strong {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        @media (max-width: 768px) {
            .signup-container {
                padding: 40px 30px;
                margin: 20px;
            }

            .back-link {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .scroll-top {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 25px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"] {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating geometric elements -->
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>

    <a href="/" class="back-link">← Back to Home</a>
    
    <!-- Scroll to top button -->
    <button class="scroll-top" id="scrollTopBtn" onclick="scrollToTop()">↑</button>
    
    <div class="signup-container fade-in-up">
        <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradient for the Norse symbol -->
                <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ecedee;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#c6d3e8;stop-opacity:1" />
                </linearGradient>
                
                <!-- Glow effect -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge> 
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <!-- Norse-inspired geometric symbol (combination of Valknut and circuit patterns) -->
            <g transform="translate(60, 60)" filter="url(#glow)">
                <!-- Central triangle (Valknut inspired) - sized for signup page -->
                <polygon points="-36,-20 34,-20 0,36" fill="none" stroke="url(#symbolGradient)" stroke-width="2.5" stroke-linejoin="round"/>
                
                <!-- AI circuit nodes -->
                <circle cx="-26" cy="-16" r="3" fill="url(#symbolGradient)"/>
                <circle cx="26" cy="-16" r="3" fill="url(#symbolGradient)"/>
                <circle cx="0" cy="26" r="3" fill="url(#symbolGradient)"/>
                <circle cx="0" cy="-2" r="2.5" fill="url(#symbolGradient)"/>
                
                <!-- Connection lines (AI network) -->
                <line x1="-26" y1="-16" x2="0" y2="-2" stroke="url(#symbolGradient)" stroke-width="1.4" opacity="0.7"/>
                <line x1="26" y1="-16" x2="0" y2="-2" stroke="url(#symbolGradient)" stroke-width="1.4" opacity="0.7"/>
                <line x1="0" y1="-2" x2="0.0001" y2="26" stroke="url(#symbolGradient)" stroke-width="1.4" opacity="0.7"/>
            </g>
        </svg>
        <div class="subtitle">Join the future of AI-powered learning</div>
        
        <div id="message"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email (Optional)</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                <div id="passwordStrength" class="password-strength" style="display: none;"></div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
            </div>
            
            <button type="submit" class="btn" id="signupBtn">
                Create Account
                <span id="loading" class="loading" style="display: none;"></span>
            </button>
        </form>
        
        <div class="links">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

    <script>
        // Scroll-triggered animations
        function animateOnScroll() {
            const elements = document.querySelectorAll('.fade-in-up');
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('animate');
                }
            });
        }

        // Show/hide scroll to top button
        function handleScrollButton() {
            const scrollTopBtn = document.getElementById('scrollTopBtn');
            if (window.pageYOffset > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        }

        // Scroll to top function
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Smooth scroll for anchor links
        function smoothScrollToElement(targetId) {
            const element = document.getElementById(targetId);
            if (element) {
                element.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }

        // Event listeners
        window.addEventListener('scroll', () => {
            animateOnScroll();
            handleScrollButton();
        });

        window.addEventListener('load', () => {
            animateOnScroll();
        });

        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.style.display = 'none';
                return;
            }
            
            let strength = 0;
            let message = '';
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            strengthDiv.style.display = 'block';
            
            if (strength < 2) {
                strengthDiv.className = 'password-strength strength-weak';
                message = 'Weak Password';
            } else if (strength < 4) {
                strengthDiv.className = 'password-strength strength-medium';
                message = 'Medium Password';
            } else {
                strengthDiv.className = 'password-strength strength-strong';
                message = 'Strong Password';
            }
            
            strengthDiv.textContent = message;
        });
        
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const signupBtn = document.getElementById('signupBtn');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            
            // Validation
            if (!username || !password || !confirmPassword) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }
            
            if (username.length < 3) {
                showMessage('Username must be at least 3 characters long', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Show loading state
            signupBtn.disabled = true;
            loading.style.display = 'inline-block';
            messageDiv.innerHTML = '';
            
            try {
                const requestBody = {
                    username: username,
                    password: password
                };
                
                if (email) {
                    requestBody.email = email;
                }
                
                const response = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store session token and student ID (Note: In production, avoid localStorage for sensitive data)
                    localStorage.setItem('session_token', data.session_token);
                    localStorage.setItem('student_id', data.student_id);
                    
                    showMessage('Account created successfully!', 'success');
                    
                    // Redirect to user dashboard after a brief delay
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                    
                } else {
                    showMessage(data.detail || 'Signup failed', 'error');
                }
                
            } catch (error) {
                showMessage('Connection error. Please try again.', 'error');
                console.error('Signup error:', error);
            } finally {
                signupBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            
            // Smooth scroll to message if it's not visible
            messageDiv.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });
        }
        
    </script>
</body>
</html>
