version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "6700:6700"
    environment:
      - PYTHONPATH=/app
    env_file:
      - stack.env
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - norseai

networks:
  norseai:
    external: true