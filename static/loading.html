<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorseAI - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e2e8f0;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(600px circle at 20% 30%, #3b82f620 0%, transparent 50%),
                radial-gradient(800px circle at 80% 70%, #3b82f620 0%, transparent 50%),
                radial-gradient(400px circle at 40% 80%, #06b6d420 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .geometric-shape {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f640, #06b6d440);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .loading-container {
            text-align: center;
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            padding: 60px 50px;
            border-radius: 24px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .loading-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            height: 120px;
        }

        .norse-logo {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
        }

        /* Initial states - everything hidden */
        .logo-triangle {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            transition: stroke-dashoffset 0.8s ease-out;
        }

        .logo-node {
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }

        .logo-line {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            transition: stroke-dashoffset 0.5s ease-out;
        }
        
        .loading-message {
            font-size: 1.3rem;
            color: #94a3b8;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #7aa4e7);
            border-radius: 3px;
            width: 0%;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: progressShine 2s ease-in-out infinite;
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .error-message {
            background: rgba(220, 38, 38, 0.1);
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            display: none;
            border: 1px solid rgba(220, 38, 38, 0.3);
            backdrop-filter: blur(10px);
        }

        .error-message strong {
            color: #f87171;
        }
        
        .retry-button {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            display: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .retry-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .retry-button:hover::before {
            left: 100%;
        }
        
        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            .loading-container {
                padding: 40px 30px;
                margin: 20px;
            }

            .norse-logo {
                width: 100px;
                height: 100px;
            }

            .loading-logo {
                height: 100px;
            }

            .loading-message {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .loading-container {
                padding: 30px 20px;
            }

            .norse-logo {
                width: 80px;
                height: 80px;
            }

            .loading-logo {
                height: 80px;
            }

            .loading-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating geometric elements -->
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>

    <div class="loading-container">
        <div class="loading-logo">
            <svg class="norse-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradient for the logo -->
                    <linearGradient id="heroSymbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#f8fafc;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Glow effect -->
                    <filter id="heroGlow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge> 
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- Norse-inspired geometric symbol (combination of Valknut and circuit patterns) -->
                <g transform="translate(60, 60)" filter="url(#heroGlow)">
                    <!-- Central triangle (Valknut inspired) - scaled appropriately -->
                    <polygon class="logo-triangle" points="-35,-26 33,-26 0,33" fill="none" stroke="url(#heroSymbolGradient)" stroke-width="2.5" stroke-linejoin="round"/>
                   
                    <!-- AI circuit nodes -->
                    <circle class="logo-node" id="node-1" cx="-28" cy="-22" r="2.5" fill="url(#heroSymbolGradient)"/>
                    <circle class="logo-node" id="node-2" cx="27" cy="-22" r="2.5" fill="url(#heroSymbolGradient)"/>
                    <circle class="logo-node" id="node-3" cx="0" cy="25" r="2.5" fill="url(#heroSymbolGradient)"/>
                    <circle class="logo-node" id="node-center" cx="0" cy="-5" r="3" fill="url(#heroSymbolGradient)"/>
                   
                    <!-- Connection lines (AI network) -->
                    <line class="logo-line" id="line-1" x1="-26" y1="-21" x2="2" y2="-3" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity="0.85"/>
                    <line class="logo-line" id="line-2" x1="26" y1="-21" x2="-2" y2="-3" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity="0.85"/>
                    <line class="logo-line" id="line-3" x1="0" y1="-3" x2="0.0001" y2="22" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity="0.85"/>
                </g>
            </svg>
        </div>
        
        <div class="loading-message" id="loadingMessage">Checking authentication...</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Initializing your learning environment</span>
        </div>
        
        <div class="error-message" id="errorMessage">
            <strong>Something went wrong!</strong><br>
            <span id="errorDetails"></span>
        </div>
        
        <button class="retry-button" id="retryButton" onclick="retryInitialization()">
            Try Again
        </button>
    </div>
    
    <script>
        let studentId = null;
        let animationInterval = null;
        
        window.addEventListener('load', function() {
            startLogoAnimation();
            initializeApp();
        });

        async function initializeApp() {
            try {
                await performInitialization();
            } catch (error) {
                console.error('Initialization failed:', error);
                showError(error.message);
            }
        }
        
        async function performInitialization() {
            // Step 1: Check authentication
            updateMessage('Checking authentication...');
            updateProgress(20);
            await sleep(800);
            
            const sessionToken = getSessionToken();
            studentId = getStudentId();
            
            if (!sessionToken || !studentId) {
                // For demo purposes, we'll simulate having a session
                console.log('No session found, would normally redirect to login');
                sessionToken = 'demo-session';
                studentId = 'demo-student';
            }
            
            // Step 2: Initialize student
            updateMessage('Initializing student profile...');
            updateProgress(60);
            await sleep(500);
            
            await initializeStudentState();
            
            // Step 3: Ready
            updateMessage('Setting up your workspace...');
            updateProgress(90);
            await sleep(800);
            
            updateMessage('Ready!');
            updateProgress(100);
            
            await sleep(1500);
            
            window.location.href = '/chat';
        }

        function startLogoAnimation() {
            let isForward = true;
            
            // Start the first animation
            animateLogo();
            
            // Set up repeating animation cycle
            animationInterval = setInterval(() => {
                if (isForward) {
                    reverseLogo();
                } else {
                    animateLogo();
                }
                isForward = !isForward;
            }, 3500);
        }
        
        function stopLogoAnimation() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }
        
        function animateLogo() {
            const triangle = document.querySelector('.logo-triangle');
            const nodes = document.querySelectorAll('.logo-node');
            const lines = document.querySelectorAll('.logo-line');
            
            // Draw triangle first
            setTimeout(() => {
                triangle.style.strokeDashoffset = '0';
            }, 500);
            
            // Show nodes in sequence
            setTimeout(() => {
                document.getElementById('node-1').style.opacity = '1';
            }, 1200);
            
            setTimeout(() => {
                document.getElementById('node-2').style.opacity = '1';
            }, 1500);
            
            setTimeout(() => {
                document.getElementById('node-3').style.opacity = '1';
            }, 1800);
            
            setTimeout(() => {
                document.getElementById('node-center').style.opacity = '1';
            }, 2100);
            
            // Draw lines last
            setTimeout(() => {
                document.getElementById('line-1').style.strokeDashoffset = '0';
            }, 2400);
            
            setTimeout(() => {
                document.getElementById('line-2').style.strokeDashoffset = '0';
            }, 2600);
            
            setTimeout(() => {
                document.getElementById('line-3').style.strokeDashoffset = '0';
            }, 2800);
        }
        
        function reverseLogo() {
            const triangle = document.querySelector('.logo-triangle');
            const nodes = document.querySelectorAll('.logo-node');
            const lines = document.querySelectorAll('.logo-line');
            
            // Reverse the lines first
            setTimeout(() => {
                document.getElementById('line-3').style.strokeDashoffset = '50';
            }, 0);
            
            setTimeout(() => {
                document.getElementById('line-2').style.strokeDashoffset = '50';
            }, 200);
            
            setTimeout(() => {
                document.getElementById('line-1').style.strokeDashoffset = '50';
            }, 400);
            
            // Hide nodes in reverse order
            setTimeout(() => {
                document.getElementById('node-center').style.opacity = '0';
            }, 700);
            
            setTimeout(() => {
                document.getElementById('node-3').style.opacity = '0';
            }, 1000);
            
            setTimeout(() => {
                document.getElementById('node-2').style.opacity = '0';
            }, 1300);
            
            setTimeout(() => {
                document.getElementById('node-1').style.opacity = '0';
            }, 1600);
            
            // Hide triangle last
            setTimeout(() => {
                triangle.style.strokeDashoffset = '300';
            }, 2000);
        }
        
        async function initializeStudentState() {
                // Simulate API call - in real implementation, uncomment the fetch code below
                
                const response = await fetch(`/chat/init/${studentId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('Student initialized:', result);
                return result;
        }
        
        // Utility functions to handle localStorage safely
        function getSessionToken() {
            try {
                if (typeof Storage !== "undefined" && localStorage) {
                    return localStorage.getItem('session_token');
                }
            } catch (error) {
                console.warn('localStorage not available:', error);
            }
            return null;
        }
        
        function getStudentId() {
            try {
                if (typeof Storage !== "undefined" && localStorage) {
                    return localStorage.getItem('student_id');
                }
            } catch (error) {
                console.warn('localStorage not available:', error);
            }
            return null;
        }
        
        function updateMessage(message) {
            const messageElement = document.getElementById('loadingMessage');
            if (messageElement) {
                messageElement.textContent = message;
            }
        }
        
        function updateProgress(percentage) {
            const progressFill = document.getElementById('progressFill');
            if (progressFill) {
                progressFill.style.width = percentage + '%';
            }
        }
        
        function showError(message) {
            const errorDetails = document.getElementById('errorDetails');
            const errorMessage = document.getElementById('errorMessage');
            const retryButton = document.getElementById('retryButton');
            
            if (errorDetails) errorDetails.textContent = message;
            if (errorMessage) errorMessage.style.display = 'block';
            if (retryButton) retryButton.style.display = 'inline-block';
            
            updateProgress(0);
            stopLogoAnimation();
        }
        
        function retryInitialization() {
            // Hide error message and retry button
            const errorMessage = document.getElementById('errorMessage');
            const retryButton = document.getElementById('retryButton');
            
            if (errorMessage) errorMessage.style.display = 'none';
            if (retryButton) retryButton.style.display = 'none';
            
            updateProgress(0);
            startLogoAnimation();
            
            // Retry initialization
            setTimeout(() => {
                performInitialization();
            }, 500);
        }
        
        // Utility function for delays
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
