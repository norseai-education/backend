<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NorseAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e2e8f0;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements - matching home.html */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(600px circle at 20% 30%, #3b82f620 0%, transparent 50%),
                radial-gradient(800px circle at 80% 70%, #3b82f620 0%, transparent 50%),
                radial-gradient(400px circle at 40% 80%, #06b6d420 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 60px;
            background: transparent;
            backdrop-filter: none;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            height: 60px;
            width: 250px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .user-welcome {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #ffffff;
            font-size: 16px;
        }

        .user-welcome span {
            font-weight: 600;
            color: #ecedf0;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #7ea6e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 16px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-secondary {
            background: transparent;
            color: #ecedf0;
            border: none;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.1);
            color: #e2e8f0;
            border-color: rgba(217, 222, 228, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(126, 166, 232, 0.2);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 40px;
            position: relative;
        }

        .hero {
            max-width: 800px;
            margin-bottom: 60px;
        }

        /* .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #758fb4, #7ea6e8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        } */

        .hero p {
            font-size: 1.4rem;
            margin-bottom: 50px;
            color: #94a3b8;
            line-height: 1.7;
            font-weight: 400;
        }

        .start-lesson-btn {
            background: linear-gradient(135deg, #667489, #94a3b8, #c6d3e8);
            color: white;
            font-size: 1.5rem;
            padding: 24px 48px;
            border: none;
            outline: none;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(126, 166, 232, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            position: relative;
            overflow: hidden;
        }

        .start-lesson-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 45px rgba(126, 166, 232, 0.6);
        }

        .start-lesson-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .start-lesson-btn:hover::before {
            left: 100%;
        }



        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            margin: 10% auto;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            color: #e2e8f0;
            text-align: center;
            border: 1px solid rgba(126, 166, 232, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            color: #7ea6e8;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .modal p {
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .close {
            color: #94a3b8;
            float: right;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            margin-top: -10px;
            transition: color 0.3s;
        }

        .close:hover {
            color: #e2e8f0;
        }

        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .geometric-shape {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f640, #06b6d440);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667489, #d8dced);
            color: white;
            border: none;
            outline: none;
            box-shadow: 0 8px 25px rgba(126, 166, 232, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(126, 166, 232, 0.4);
        }

        @media (max-width: 768px) {
            header {
                padding: 20px 30px;
                flex-direction: column;
                gap: 25px;
            }

            .user-welcome {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .hero h1 {
                font-size: 2.8rem;
            }

            .hero p {
                font-size: 1.2rem;
            }

            .start-lesson-btn {
                font-size: 1.3rem;
                padding: 20px 40px;
            }

            .features {
                grid-template-columns: 1fr;
                margin-top: 60px;
                gap: 30px;
            }

            .main-content {
                padding: 60px 20px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .start-lesson-btn {
                font-size: 1.1rem;
                padding: 18px 36px;
            }

            header {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating geometric elements -->
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>

    <div class="container">
        <header>
            <svg class="logo" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradient for the main text -->
                    <linearGradient id="heroTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#7ea6e8;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#94a3b8;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Gradient for the Norse symbol -->
                    <linearGradient id="heroSymbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ecedee;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#c6d3e8;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Glow effect -->
                    <filter id="heroGlow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge> 
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    
                    <!-- Subtle shadow -->
                    <filter id="heroShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(59, 130, 246, 0.3)"/>
                    </filter>
                </defs>
                
                <!-- Norse-inspired geometric symbol (combination of Valknut and circuit patterns) -->
                <g transform="translate(45, 50)" filter="url(#heroGlow)">
                    <!-- Central triangle (Valknut inspired) - made even bigger -->
                    <polygon points="-41,-31 39,-31 0,39" fill="none" stroke="url(#heroSymbolGradient)" stroke-width="2.5" stroke-linejoin="round"/>
                    
                    <!-- AI circuit nodes -->
                    <circle cx="-33" cy="-26.5" r="2.5" fill="url(#heroSymbolGradient)"/>
                    <circle cx="31.5" cy="-26.5" r="2.5" fill="url(#heroSymbolGradient)"/>
                    <circle cx="0" cy="29" r="2.5" fill="url(#heroSymbolGradient)"/>
                    <circle cx="0" cy="-6" r="3" fill="url(#heroSymbolGradient)"/>
                    
                    <!-- Connection lines (AI network) -->
                    <line x1="-31" y1="-25.5" x2="2" y2="-4" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity=".85"/>
                    <line x1="31" y1="-25.5" x2="-2" y2="-4" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity="0.85"/>
                    <line x1="0" y1="-4" x2="0.0001" y2="26.5" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity="0.85"/>
                </g>
                
                <!-- Main text: NorseAI -->
                <text x="95" y="50" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#heroTextGradient)" filter="url(#heroShadow)">
                    NorseAI
                </text>
                <!-- test -->
                <!-- Subtitle: TEACHER -->
                <text x="95" y="75" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2px">
                    TEACHER
                </text>
                
                <!-- Decorative underline -->
                <line x1="95" y1="82" x2="200" y2="82" stroke="url(#heroTextGradient)" stroke-width="2" opacity="0.6"/>
                
                <!-- Subtle tech accent dots -->
                <circle cx="210" cy="45" r="2" fill="#3b82f6" opacity="0.6">
                    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="220" cy="40" r="1.5" fill="#3b82f6" opacity="0.4">
                    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="215" cy="55" r="1" fill="#3b82f6" opacity="0.5">
                    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
                </circle>
            </svg>
            <div class="user-welcome" id="userWelcome">
                <div class="user-avatar" id="userAvatar">U</div>
                <span id="welcomeText">Welcome back!</span>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <main class="main-content">
            <div class="hero">
                <!-- <h1>Ready to Learn?</h1>
                <p>Your AI-powered learning journey awaits. Start a lesson and unlock your potential with personalized education.</p> -->
                <button class="btn start-lesson-btn" onclick="startLesson()">Start Lesson</button>
            </div>


        </main>
    </div>

    <!-- Login Required Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Session Expired</h2>
            <p>Your session has expired. Please login again to continue your learning journey.</p>
            <div style="margin-top: 30px; display: flex; gap: 20px; justify-content: center;">
                <a href="/login" class="btn btn-primary">Login</a>
            </div>
        </div>
    </div>

    <script>
        // Check authentication status on page load
        window.addEventListener('load', async function() {
            await checkAuthStatus();
        });

        async function checkAuthStatus() {
            const sessionToken = localStorage.getItem('session_token');
            
            if (!sessionToken) {
                // No session token, redirect to home
                window.location.href = '/';
                return;
            }
            
            try {
                const response = await fetch('/auth/user-info', {
                    headers: {
                        'Authorization': `Bearer ${sessionToken}`
                    }
                });
                
                const userInfo = await response.json();
                
                if (userInfo.authenticated) {
                    // User is logged in, update welcome message
                    document.getElementById('welcomeText').textContent = `Welcome, ${userInfo.username}!`;
                    
                    // Set user avatar to first letter of username
                    const firstLetter = userInfo.username.charAt(0).toUpperCase();
                    document.getElementById('userAvatar').textContent = firstLetter;
                } else {
                    // Invalid session, clear storage and redirect
                    localStorage.removeItem('session_token');
                    localStorage.removeItem('student_id');
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error checking auth status:', error);
                // On error, redirect to home
                window.location.href = '/';
            }
        }

        async function logout() {
            const sessionToken = localStorage.getItem('session_token');
            
            if (!confirm('Are you sure you want to logout?')) {
                return;
            }
            
            try {
                if (sessionToken) {
                    await fetch('/auth/logout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(sessionToken)
                    });
                }
            } catch (error) {
                console.error('Logout error:', error);
            } finally {
                // Clear local storage and redirect to home
                localStorage.removeItem('session_token');
                localStorage.removeItem('student_id');
                window.location.href = '/';
            }
        }

        function startLesson() {
            // Check if user still has valid session
            const sessionToken = localStorage.getItem('session_token');
            
            if (!sessionToken) {
                // Show login modal
                document.getElementById('loginModal').style.display = 'block';
            } else {
                // Redirect to loading page for chat UI
                window.location.href = '/loading';
            }
        }

        function closeModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        // Close modal if user clicks outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
