<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorseAI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e2e8f0;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(600px circle at 20% 30%, #3b82f620 0%, transparent 50%),
                radial-gradient(800px circle at 80% 70%, #8b5cf620 0%, transparent 50%),
                radial-gradient(400px circle at 40% 80%, #06b6d420 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Dashboard-style header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 60px;
            background:transparent;
            backdrop-filter: none;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            height: 60px;
            width: 250px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .user-welcome {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #e2e8f0;
            font-size: 16px;
        }

        .user-welcome span {
            font-weight: 600;
            color: #ecedf0;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #7ea6e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 16px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-secondary {
            background: transparent;
            outline: none;
            color: #ecedf0;
            border: none;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.1);
            color: #e2e8f0;
            border-color: rgba(148, 163, 184, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(126, 166, 232, 0.2);
        }

        .back-home-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .back-home-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .back-home-btn:hover::before {
            left: 100%;
        }

        .back-home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        /* Main content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .chat-container {
            border: 1px solid rgba(59, 130, 246, 0.2);
            height: 500px;
            overflow-y: auto;
            padding: 25px;
            margin-bottom: 25px;
            background: rgba(15, 15, 35, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            scrollbar-width: thin;
            scrollbar-color: rgba(59, 130, 246, 0.5) transparent;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(15, 15, 35, 0.3);
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.7);
        }

        .message {
            margin: 15px 0;
            padding: 16px 20px;
            border-radius: 16px;
            word-wrap: break-word;
            max-width: 80%;
            position: relative;
            backdrop-filter: blur(10px);
            line-height: 1.5;
            font-size: 15px;
        }

        .user-message {
            background: linear-gradient(135deg, #3b82f6, #7788f2);
            color: white;
            margin-left: auto;
            margin-right: 0;
            text-align: right;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .ai-message {
            background: rgba(15, 15, 35, 0.8);
            color: #e2e8f0;
            border: 1px solid rgba(59, 130, 246, 0.2);
            margin-right: auto;
            margin-left: 0;
            border-bottom-left-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .system-message {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
            font-style: italic;
            text-align: center;
            margin: 20px auto;
            max-width: 70%;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .input-container {
            display: flex;
            gap: 15px;
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(15, 15, 35, 0.6);
            color: #e2e8f0;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 15, 35, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        button {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        button:hover::before {
            left: 100%;
        }



        #endButton {
            background: transparent;
            color: #ecedf0;
            border: 2px solid rgba(243, 243, 243, 0.793);
            backdrop-filter: blur(10px);
        }

        #endButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        button:disabled {
            background: linear-gradient(135deg, #374151, #4b5563) !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        button:disabled::before {
            display: none;
        }

        .status {
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            border: 1px solid rgba(59, 130, 246, 0.2);
            font-weight: 500;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(20px);
        }

        .modal-content h2 {
            background: linear-gradient(135deg, #34d399, #10b981);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: 800;
        }

        .modal-content p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }

        .modal-btn {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .modal-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .modal-btn:hover::before {
            left: 100%;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(52, 211, 153, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Floating elements for background */
        .floating-element {
            position: fixed;
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
            z-index: -1;
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 60%;
            right: 15%;
            animation-delay: 3s;
        }

        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        .geometric-shape {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f640, #8b5cf640);
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            header {
                padding: 20px 30px;
                flex-direction: column;
                gap: 25px;
            }

            .user-welcome {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .main-content {
                padding: 15px;
            }

            .chat-container {
                height: 400px;
                padding: 20px;
            }

            .input-container {
                flex-direction: column;
                padding: 20px;
                gap: 12px;
            }

            .message {
                max-width: 90%;
            }

            button {
                width: 100%;
                justify-content: center;
            }

            #endButton {
                min-width: auto;
            }
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 350px;
                padding: 15px;
            }

            .message {
                padding: 12px 16px;
                font-size: 14px;
            }

            .modal-content {
                padding: 30px 25px;
            }

            .modal-content h2 {
                font-size: 1.5rem;
            }

            header {
                padding: 15px 20px;
            }
        }

        /* Custom styling for better visual hierarchy */
        .message:last-child {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Floating geometric elements -->
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>

    <div class="container">
        <!-- Dashboard-style header -->
        <header>
            <svg class="logo" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradient for the main text -->
                        <linearGradient id="heroTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#7ea6e8;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#94a3b8;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Gradient for the Norse symbol -->
                        <linearGradient id="heroSymbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ecedee;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#c6d3e8;stop-opacity:1" />
                        </linearGradient>
                        
                        <!-- Glow effect -->
                        <filter id="heroGlow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge> 
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        
                        <!-- Subtle shadow -->
                        <filter id="heroShadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(59, 130, 246, 0.3)"/>
                        </filter>
                    </defs>
                    
                    <!-- Norse-inspired geometric symbol (combination of Valknut and circuit patterns) -->
                    <g transform="translate(45, 50)" filter="url(#heroGlow)">
                        <!-- Central triangle (Valknut inspired) - made even bigger -->
                        <polygon points="-41,-31 39,-31 0,39" fill="none" stroke="url(#heroSymbolGradient)" stroke-width="2.5" stroke-linejoin="round"/>
                        
                        <!-- AI circuit nodes -->
                        <circle cx="-33" cy="-26.5" r="2.5" fill="url(#heroSymbolGradient)"/>
                        <circle cx="31.5" cy="-26.5" r="2.5" fill="url(#heroSymbolGradient)"/>
                        <circle cx="0" cy="29" r="2.5" fill="url(#heroSymbolGradient)"/>
                        <circle cx="0" cy="-6" r="3" fill="url(#heroSymbolGradient)"/>
                        
                        <!-- Connection lines (AI network) -->
                        <line x1="-31" y1="-25.5" x2="2" y2="-4" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity=".85"/>
                        <line x1="31" y1="-25.5" x2="-2" y2="-4" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity="0.85"/>
                        <line x1="0" y1="-4" x2="0.0001" y2="26.5" stroke="url(#heroSymbolGradient)" stroke-width="1.5" opacity="0.85"/>
                    </g>
                    
                    <!-- Main text: NorseAI -->
                    <text x="95" y="50" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#heroTextGradient)" filter="url(#heroShadow)">
                        NorseAI
                    </text>
                    
                    <!-- Subtitle: TEACHER -->
                    <text x="95" y="75" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2px">
                        TEACHER
                    </text>
                    
                    <!-- Decorative underline -->
                    <line x1="95" y1="82" x2="200" y2="82" stroke="url(#heroTextGradient)" stroke-width="2" opacity="0.6"/>
                    
                    <!-- Subtle tech accent dots -->
                    <circle cx="210" cy="45" r="2" fill="#3b82f6" opacity="0.6">
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="220" cy="40" r="1.5" fill="#3b82f6" opacity="0.4">
                        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="215" cy="55" r="1" fill="#3b82f6" opacity="0.5">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            <div class="user-welcome" id="userWelcome">
                <div class="user-avatar" id="userAvatar">U</div>
                <span id="welcomeText">Welcome back!</span>
                <a href="/dashboard" class="btn btn-secondary">← Dashboard</a>
                <button onclick="logout()" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <div class="main-content">
            <div class="chat-container" id="chatContainer">
                <div class="message system-message">
                    Welcome to your AI learning session! 🚀
                </div>
            </div>
            
            <div class="status" id="statusBar">
                Ready to chat
            </div>
            
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Type your message here... (Press Enter to send)" onkeypress="handleKeyPress(event)">
                <button onclick="endSession()" id="endButton">End Session</button>
            </div>
        </div>
    </div>
    
    <!-- Lesson Completion Modal -->
    <div class="modal-overlay" id="lessonCompleteModal">
        <div class="modal-content">
            <h2>🎉 Lesson Completed!</h2>
            <p>Congratulations! You have successfully completed this lesson and expanded your knowledge.</p>
            <a href="/dashboard" class="modal-btn">Back to Dashboard</a>
        </div>
    </div>

    <script>
        let isStreaming = false;
        let studentId = null;
        
        // Check authentication and initialize on page load
        window.addEventListener('load', async function() {
            await initializePage();
        });

        async function initializePage() {
            // Verify authentication (redirect to loading page if not authenticated)
            const sessionToken = localStorage.getItem('session_token');
            studentId = localStorage.getItem('student_id');
            
            if (!sessionToken || !studentId) {
                window.location.href = '/loading';
                return;
            }

            // Check auth status and update header
            await checkAuthStatus();
            
            // Focus on input
            document.getElementById('messageInput').focus();
            updateStatus('Ready to chat');
        }

        async function checkAuthStatus() {
            const sessionToken = localStorage.getItem('session_token');
            
            if (!sessionToken) {
                window.location.href = '/';
                return;
            }
            
            try {
                const response = await fetch('/auth/user-info', {
                    headers: {
                        'Authorization': `Bearer ${sessionToken}`
                    }
                });
                
                const userInfo = await response.json();
                
                if (userInfo.authenticated) {
                    // User is logged in, update welcome message
                    document.getElementById('welcomeText').textContent = `Welcome, ${userInfo.username}!`;
                    
                    // Set user avatar to first letter of username
                    const firstLetter = userInfo.username.charAt(0).toUpperCase();
                    document.getElementById('userAvatar').textContent = firstLetter;
                } else {
                    // Invalid session, clear storage and redirect
                    localStorage.removeItem('session_token');
                    localStorage.removeItem('student_id');
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error checking auth status:', error);
                // On error, redirect to home
                window.location.href = '/';
            }
        }

        async function logout() {
            const sessionToken = localStorage.getItem('session_token');
            
            if (!confirm('Are you sure you want to logout?')) {
                return;
            }
            
            try {
                if (sessionToken) {
                    await fetch('/auth/logout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(sessionToken)
                    });
                }
            } catch (error) {
                console.error('Logout error:', error);
            } finally {
                // Clear local storage and redirect to home
                localStorage.removeItem('session_token');
                localStorage.removeItem('student_id');
                window.location.href = '/';
            }
        }
        
        function updateStatus(message, isLoading = false) {
            const statusBar = document.getElementById('statusBar');
            statusBar.innerHTML = message + (isLoading ? '<span class="loading"></span>' : '');
        }
        
        function addMessage(content, type, timestamp = true) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            
            if (timestamp && type !== 'system') {
                const time = new Date().toLocaleTimeString();
                content = `${content}\n\n${time}`;
            }
            
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isStreaming) {
                sendMessage();
            }
        }
        
        function clearSystemMessages() {
            const chatContainer = document.getElementById('chatContainer');
            const systemMessages = chatContainer.querySelectorAll('.system-message');
            systemMessages.forEach(msg => {
                if (msg.textContent.includes('Processing...') || msg.textContent.includes('Welcome!')) {
                    msg.remove();
                }
            });
        }
        
        async function sendMessage() {
            if (isStreaming || !studentId) return;
            
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message) {
                updateStatus('Please enter a message');
                return;
            }
            
            // Clear any welcome messages
            clearSystemMessages();
            
            isStreaming = true;
            messageInput.disabled = true;
            updateStatus('Sending message...', true);
            
            try {
                const response = await fetch(`/chat/s/${studentId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({message: message})
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                updateStatus('Receiving response...', true);
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                
                                if (data.type === 'user_message') {
                                    addMessage(data.content, 'user');
                                    messageInput.value = '';
                                } else if (data.type === 'ai_response') {
                                    addMessage(data.content, 'ai');
                                    updateStatus('Response received');
                                } else if (data.type === 'thinking') {
                                    updateStatus(data.message, true);
                                } else if (data.type === 'lesson_complete') {
                                    addMessage(data.message, 'system');
                                    updateStatus('Lesson completed');
                                    showLessonCompleteModal();
                                } else if (data.type === 'error') {
                                    addMessage(`Error: ${data.message}`, 'system');
                                    updateStatus('Error occurred');
                                } else if (data.type === 'complete') {
                                    updateStatus('Ready for next message');
                                }
                            } catch (e) {
                                console.error('Error parsing SSE data:', e);
                                updateStatus('Error processing response');
                            }
                        }
                    }
                }
                
            } catch (error) {
                addMessage(`Connection error: ${error.message}`, 'system');
                updateStatus('Connection error');
            } finally {
                isStreaming = false;
                messageInput.disabled = false;
                messageInput.focus();
                
                if (!document.getElementById('statusBar').textContent.includes('Error') && 
                    !document.getElementById('statusBar').textContent.includes('completed')) {
                    updateStatus('Ready to chat');
                }
            }
        }
        
        async function endSession() {
            if (!studentId) return;
            
            if (!confirm('Are you sure you want to end the session?')) {
                return;
            }
            
            updateStatus('Ending session...', true);
            
            try {
                const response = await fetch(`/chat/session/${studentId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    addMessage(result.message, 'system');
                    updateStatus('Session ended');
                    
                    // Clear chat container and redirect to dashboard
                    setTimeout(() => {
                        document.getElementById('chatContainer').innerHTML = 
                            '<div class="message system-message">Session ended. Redirecting to dashboard...</div>';
                        
                        // Redirect to dashboard after a short delay
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1500);
                    }, 2000);
                } else {
                    const error = await response.json();
                    addMessage(`Error ending session: ${error.detail}`, 'system');
                    updateStatus('Error ending session');
                }
            } catch (error) {
                addMessage(`Connection error: ${error.message}`, 'system');
                updateStatus('Connection error');
            }
        }
        
        // Function to show lesson completion modal
        function showLessonCompleteModal() {
            const modal = document.getElementById('lessonCompleteModal');
            modal.style.display = 'flex';
        }
        
        // Check connection status periodically
        setInterval(async function() {
            if (isStreaming || !studentId) return;
            
            try {
                const response = await fetch(`/chat/status/${studentId}`);
                if (response.ok) {
                    const status = await response.json();
                    if (status.active) {
                        const msgCount = status.message_count || 0;
                        updateStatus(`Connected (${msgCount} messages)`);
                    }
                }
            } catch (e) {
                // Silently handle connection check errors
            }
        }, 30000); // Check every 30 seconds
    </script>
</body>
