<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NorseAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(600px circle at 20% 30%, #3b82f620 0%, transparent 50%),
                radial-gradient(800px circle at 80% 70%, #8b5cf620 0%, transparent 50%),
                radial-gradient(400px circle at 40% 80%, #06b6d420 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 70%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            bottom: 15%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .geometric-shape {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f640, #8b5cf640);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .login-container {
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(59, 130, 246, 0.2);
            position: relative;
            z-index: 10;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 15, 35, 0.6);
            color: #e2e8f0;
            backdrop-filter: blur(10px);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(15, 15, 35, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667489, #d8dced);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #374151, #4b5563);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn:disabled::before {
            display: none;
        }

        .links {
            margin-top: 35px;
            padding-top: 35px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }

        .links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(10px);
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            backdrop-filter: blur(10px);
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            background: rgba(15, 15, 35, 0.6);
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            z-index: 20;
        }

        .back-link:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 40px 30px;
                margin: 20px;
            }

            .back-link {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating geometric elements -->
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>
    <div class="floating-element">
        <div class="geometric-shape"></div>
    </div>

    <a href="/" class="back-link">← Back to Home</a>
    
    <div class="login-container">
        <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradient for the Norse symbol -->
                <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ecedee;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#c6d3e8;stop-opacity:1" />
                </linearGradient>
                
                <!-- Glow effect -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge> 
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <!-- Norse-inspired geometric symbol (combination of Valknut and circuit patterns) -->
            <g transform="translate(60, 60)" filter="url(#glow)">
                <!-- Central triangle (Valknut inspired) - sized for login page -->
                <polygon points="-36,-20 34,-20 0,36" fill="none" stroke="url(#symbolGradient)" stroke-width="2.5" stroke-linejoin="round"/>
                
                <!-- AI circuit nodes -->
                <circle cx="-26" cy="-16" r="3" fill="url(#symbolGradient)"/>
                <circle cx="26" cy="-16" r="3" fill="url(#symbolGradient)"/>
                <circle cx="0" cy="26" r="3" fill="url(#symbolGradient)"/>
                <circle cx="0" cy="-2" r="2.5" fill="url(#symbolGradient)"/>
                
                <!-- Connection lines (AI network) -->
                <line x1="-26" y1="-16" x2="0" y2="-2" stroke="url(#symbolGradient)" stroke-width="1.4" opacity="0.7"/>
                <line x1="26" y1="-16" x2="0" y2="-2" stroke="url(#symbolGradient)" stroke-width="1.4" opacity="0.7"/>
                <line x1="0" y1="-2" x2="0.0001" y2="26" stroke="url(#symbolGradient)" stroke-width="1.4" opacity="0.7"/>
            </g>
        </svg>
        <div class="subtitle">Welcome back! Ready to continue learning?</div>
        
        <div id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">
                Login
                <span id="loading" class="loading" style="display: none;"></span>
            </button>
        </form>
        
        <div class="links">
            Don't have an account? <a href="/signup">Create one here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            // Show loading state
            loginBtn.disabled = true;
            loading.style.display = 'inline-block';
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store session token and student ID
                    localStorage.setItem('session_token', data.session_token);
                    localStorage.setItem('student_id', data.student_id);
                    
                    showMessage('Login successful!', 'success');
                    
                    // Redirect to user dashboard after a brief delay
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                    
                } else {
                    showMessage(data.detail || 'Login failed', 'error');
                }
                
            } catch (error) {
                showMessage('Connection error. Please try again.', 'error');
                console.error('Login error:', error);
            } finally {
                loginBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
        }
    </script>
</body>
</html>
